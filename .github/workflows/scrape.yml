name: Scrape imot.bg Lovech

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scraper.py --output public/data.json --no-csv

      - name: Commit if changed
        run: |
          git config user.name "imot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "scrape $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
